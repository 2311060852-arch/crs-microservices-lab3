spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # AUTH - LOGIN
            # =========================
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

            # =========================
            # AUTH - API KEY
            # /api/api-keys
            # /api/api-keys/{id}
            # =========================
            - id: auth-service-apikeys
              uri: http://localhost:8081
              predicates:
                - Path=/api/api-keys,/api/api-keys/**
              filters:
                - StripPrefix=1

            # =========================
            # COURSE - LIST
            # =========================
            - id: course-service-list
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            # =========================
            # COURSE - DETAIL
            # =========================
            - id: course-service-detail
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/${segment}

            # =========================
            # REGISTRATION - LIST
            # =========================
            - id: registration-service-list
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            # =========================
            # REGISTRATION - DETAIL
            # =========================
            - id: registration-service-detail
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/${segment}

            # =========================
            # PARTNER PUBLIC API
            # =========================
            - id: course-service-partner
              uri: http://localhost:8082
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses

          # =========================
          # CORS
          # =========================
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:5174"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"

server:
  port: 8080

jwt:
  secret: GIU_NGUYEN_GIA_TRI_JWT_SECRET_HIEN_TAI_CUA_BAN

management:
  endpoints:
    web:
      exposure:
        include: gateway